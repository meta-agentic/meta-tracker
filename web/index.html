<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The LogoMark from src/components/icons.tsx, with the light accent token
         baked in: a favicon is fetched outside the page, so it cannot read CSS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vectis</title>
    <!-- Pre-paint theme bootstrap: classic and blocking on purpose, so it runs
         before the module bundle is fetched. A file, not an inline script,
         because the server's CSP allows scripts from 'self' only. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
