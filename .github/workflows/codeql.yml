name: CodeQL

# Static application security testing (SAST) with the security-extended query
# suite. Findings surface in the Security > Code scanning tab.
#
# Pull requests are scanned as well as main: this is a public repository that
# takes outside contributions, so the useful moment to see a new alert is on the
# PR that introduces it, not after it has merged. Actions minutes are free for
# public repositories, and PR runs cancel each other when a newer commit lands.
#
# Java is analysed from a traced `mvn compile` rather than build-mode 'none':
# tracing a real compile sees the reactor's actual classpath, which buildless
# extraction can only approximate. `cache: maven` keeps that compile off Maven
# Central on warm runs. No tests run and no database is needed for compilation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale PR runs; never cancel a main run, so every merge commit keeps
  # its own result.
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Compile (no tests) for CodeQL
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
