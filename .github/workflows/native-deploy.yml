name: Native Build & Deploy

# Continuous delivery skeleton for the Vectis reactive server.
#
# This workflow is intentionally MODULE-AGNOSTIC: the application modules are
# being bootstrapped in parallel and their layout is not yet settled, so nothing
# here hard-codes a module path. It:
#   1. runs a reactor-wide GraalVM native build (`mvn package -Pnative`) and
#      discovers the produced `*-runner` under whichever module's target/ made it,
#   2. packages that executable into a multi-stage distroless container
#      (deploy/docker/Dockerfile.native),
#   3. on main, publishes the image to GHCR with a Sigstore (cosign) keyless
#      signature and BuildKit SBOM + SLSA provenance attestations.
#
# Rollout to staging is GitOps (deploy/argocd): Argo CD Image Updater watches the
# registry and, for each new main-<sha> image, rewrites `newTag` on the
# `env/staging` branch, which is the revision Argo CD tracks and syncs. A new
# image reaches staging with no manual step. Manifest changes under deploy/ do
# not ride along with an image; they reach staging when main is promoted into
# `env/staging`.
#
# Every application-dependent job is gated on a Maven build existing (any
# pom.xml), so — mirroring this repo's README ("CI activates as the first code
# lands") and its supply-chain/scorecard workflows — this is a green no-op until
# real application modules land, and activates automatically once they do.

on:
  push:
    branches: [main]
    # On main this workflow *publishes*, so the filter is "anything that changes
    # the image": application source and build config (keep in sync with
    # jvm-test.yml's `&jvm-paths`), the image definition under `deploy/docker/`,
    # and this pipeline. Without a filter every merge to main — a web-only or
    # docs-only one included — paid for a ~60-minute native build and a new
    # image.
    #
    # `deploy/k8s/` and `deploy/argocd/` are left out on purpose: a new image
    # does not carry manifest changes. Image Updater only rewrites `newTag` on
    # the `env/staging` branch, and manifest changes reach staging when main is
    # promoted into that branch. Rebuilding an unchanged binary for them would
    # only mint a new tag for Image Updater to roll out.
    #
    # It is a separate list from the PR one below, not an alias: publishing has
    # to follow source changes, validating the packaging on a PR must not.
    #
    # `web/**` is in the list because the image ships the built web client
    # (VEC-78): a web-only merge has to produce the image that serves it. Its
    # tests and docs are not in the image, so changing only those does not.
    paths:
      - 'vectis-*/**'
      - 'pom.xml'
      - 'vectis-*/pom.xml'
      - '.mvn/**'
      - 'web/**'
      - '!web/**/*.test.ts'
      - '!web/**/*.test.tsx'
      - '!web/**/*.md'
      - 'deploy/docker/**'
      - '.github/workflows/native-deploy.yml'
  pull_request:
    branches: [main]
    # Validate the native build whenever the module structure or this pipeline
    # changes; still a no-op until a pom.xml exists.
    #
    # This filter is deliberately narrow and deliberately excludes `.java`/`.sql`:
    # a ~60-minute native compile is a packaging gate, not a test gate. Source PRs
    # are tested by `jvm-test.yml`, which runs the same `mvn verify` against the
    # same PostgreSQL service without `-Pnative`. Widening this list instead of
    # using that workflow trades minutes of PR feedback for an hour of it.
    #
    # The `pom.xml` entries are anchored to the root and the `vectis-*` modules
    # for the same reason as in `jvm-test.yml`: an unanchored `**/pom.xml` would
    # also match anywhere under `web/` or `docs/`.
    #
    # `web/**` is left out for the same reason: a web PR is gated by
    # `web-ci.yml`, and the build below packages whatever web/ holds.
    paths:
      - 'pom.xml'
      - 'vectis-*/pom.xml'
      - 'vectis-*/**/pom.xml'
      - 'deploy/**'
      - '.github/workflows/native-deploy.yml'
  workflow_dispatch:

# Least privilege at the top level; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: native-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '25'

jobs:
  detect:
    name: detect build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_maven: ${{ steps.check.outputs.has_maven }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a Maven build (any module)
        id: check
        run: |
          if find . -name pom.xml -not -path './.git/*' | grep -q .; then
            echo "has_maven=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_maven=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml yet — native build & deploy is deferred until the application lands."
          fi

  native-build:
    name: native image
    needs: detect
    if: needs.detect.outputs.has_maven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # `mvn package` runs the test phase, and the persistence suite talks to a real
    # PostgreSQL on purpose — jsonb round-tripping, uuid byte ordering and GIN
    # containment are exactly the behaviours an in-memory substitute would fake.
    # Quarkus Dev Services is disabled in that module's test config so the target is
    # explicit, which means CI has to supply the database rather than conjure one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vectis
          POSTGRES_PASSWORD: vectis
          POSTGRES_DB: vectis
        ports:
          - 5432:5432
        # Without a health gate the build races the database and fails on connection
        # refused roughly whenever the runner is fast.
        options: >-
          --health-cmd "pg_isready -U vectis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM (JDK ${{ env.JAVA_VERSION }})
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # The image ships the web client on the server's origin (VEC-78):
      # vectis-server copies web/dist into META-INF/resources, so the SPA has to
      # be built before Maven runs. Same Node major and clean install as
      # web-ci.yml, which stays the web gate; this only builds.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web client
        working-directory: web
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::web/dist/index.html missing after npm run build."; exit 1; }

      - name: Reactor-wide native build
        # Reactor-wide so it picks up whatever modules exist; the `native` profile
        # is the convention agreed across lanes for activating the Quarkus native
        # compile. This is the pipeline's correctness gate.
        env:
          VECTIS_DB_HOST: localhost
          VECTIS_DB_PORT: '5432'
          VECTIS_DB_NAME: vectis
          VECTIS_DB_USER: vectis
          VECTIS_DB_PASSWORD: vectis
        run: >
          mvn -B -ntp package -Pnative
          -Dquarkus.native.additional-build-args=-J-Xmx6g

      - name: Stage native runner (module-agnostic)
        id: stage
        run: |
          runner="$(find . -path '*/target/*-runner' -type f -not -path './.git/*' | head -n1)"
          if [ -z "$runner" ]; then
            echo "::error::No native runner (*-runner) found under any module's target/ after 'mvn package -Pnative'."
            exit 1
          fi
          echo "Staging native runner: $runner"
          mkdir -p deploy/docker/app
          cp "$runner" deploy/docker/app/application

      - name: Smoke-test one origin on the native runner
        # The JVM tests pin the routing and headers against a fixture shell;
        # this proves the native binary carries the real web/dist and serves it
        # beside the API (VEC-78).
        run: |
          set -euo pipefail
          ./deploy/docker/app/application -Dquarkus.http.port=8080 > runner.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://localhost:8080$1"; }
          header() { curl -s -o /dev/null -D - -H 'Accept: text/html' "http://localhost:8080$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          check() { if [ "$2" = "$3" ]; then echo "ok   $1: $3"; else echo "::error::$1: expected '$2', got '$3'"; cat runner.log; exit 1; fi; }
          asset="$(curl -fs http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n1 || true)"
          check "shell names a hashed script" 1 "$([ -n "$asset" ] && echo 1 || echo 0)"
          check "GET / status" 200 "$(code /)"
          check "GET / cache" no-store "$(header / cache-control)"
          check "deep link status" 200 "$(code /board/VEC)"
          check "deep link is the shell" 1 "$(curl -s http://localhost:8080/board/VEC | grep -c 'id="root"')"
          check "GET /api/unknown status" 404 "$(code /api/unknown)"
          check "GET $asset status" 200 "$(code "$asset")"
          check "GET $asset cache" "public, max-age=31536000, immutable" "$(header "$asset" cache-control)"

      - name: Upload staged runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vectis-runner-${{ github.sha }}
          path: deploy/docker/app/application
          if-no-files-found: error
          retention-days: 7

  image:
    name: distroless image
    needs: native-build
    # Build+publish only from main or a manual dispatch — never push an image
    # from an untrusted PR context. On PRs, native-build alone is the gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push image + SBOM/provenance attestations to GHCR
      id-token: write         # cosign keyless (OIDC) signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download staged runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vectis-runner-${{ github.sha }}
          path: deploy/docker/app

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main-<sha> is the immutable tag Argo CD Image Updater watches for
          # staging; the moving `staging` tag aids manual inspection only.
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/docker
          file: ./deploy/docker/Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        # Keyless signature bound to this workflow's OIDC identity; verifiable with
        # `cosign verify --certificate-identity-regexp ... --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
