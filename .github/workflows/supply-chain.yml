name: Supply Chain Security

# Supply chain integrity checks: SBOM generation and deep CVE analysis.
#
#  • SBOM (CycloneDX) — machine-readable software bill of materials for every
#    commit to main; attached to releases.
#
#  • OWASP Dependency Check — full NVD CVE scan of all direct and transitive
#    Maven dependencies. Runs weekly and on push to main. NVD data is cached
#    between runs. Optionally accelerated by setting the NVD_API_KEY repository
#    secret (https://nvd.nist.gov/developers/request-an-api-key).
#
# Both Maven jobs are gated on a build manifest (pom.xml) existing, so this
# workflow is a no-op (green) until the application build lands, and activates
# automatically once it does.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly Monday 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  detect:
    name: detect build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_maven: ${{ steps.check.outputs.has_maven }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Maven build
        id: check
        run: |
          if [ -f pom.xml ]; then
            echo "has_maven=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_maven=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml yet — supply-chain scans are deferred until the build lands."
          fi

  sbom:
    name: SBOM (CycloneDX)
    needs: detect
    if: needs.detect.outputs.has_maven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Generate aggregate SBOM
        # Produces a CycloneDX BOM covering all modules and their transitive
        # dependencies. Output: target/bom.json (CycloneDX JSON schema v1.4).
        run: >
          mvn -B -ntp -DskipTests
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: target/bom.json
          retention-days: 90

  owasp-dc:
    name: OWASP Dependency Check
    needs: detect
    if: needs.detect.outputs.has_maven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: OWASP Dependency Check
        # Fails the build only on CVSS ≥ 10 (perfect score = actively exploited
        # critical RCE with no fix). Advisory findings surface via SARIF.
        # Set NVD_API_KEY repository secret to remove NVD rate-limit throttle.
        run: >
          mvn -B -ntp
          org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=10
          -DskipTests
          -Dformat=SARIF
          -DdataDirectory=$HOME/.m2/repository/org/owasp/dependency-check-data
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      - name: Upload OWASP DC SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true
