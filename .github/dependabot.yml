version: 2
updates:
  # Keep GitHub Actions pinned and current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init, analyze and upload-sarif must share one version, or CodeQL fails
      # ("Loaded a configuration file for version X, but running version Y").
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Playwright browser journeys (VEC-79).
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Maven and the web client's npm manifests are not watched here yet; Dependabot
  # security updates still cover them.
