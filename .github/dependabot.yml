version: 2
updates:
  # Keep GitHub Actions pinned and current, one grouped PR per run. Related
  # actions must move together: init, analyze and upload-sarif of CodeQL share
  # one version, or CodeQL fails ("Loaded a configuration file for version X,
  # but running version Y"). A single catch-all group covers them and every
  # other action, so a half-applied bump cannot land.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The Maven reactor: minor and patch updates together in one PR; majors
  # arrive on their own so a breaking change is reviewed alone.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # The web client.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch

  # The Playwright browser journeys (VEC-79).
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      e2e-minor-patch:
        update-types:
          - minor
          - patch
