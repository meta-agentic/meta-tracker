apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vectis-staging

resources:
  - ../../base

# Staging has no managed database, so it runs the in-cluster PostgreSQL. The
# `vectis-db` Secret it and the server read has to exist in this namespace
# before the first sync (see ../../base/deployment.yaml).
components:
  - ../../components/postgres

nameSuffix: -staging

# `nameSuffix` renames the database Service to `vectis-db-staging` but cannot
# reach the hostname stored as a plain string in the ConfigMap. Copy the final
# Service name into `VECTIS_DB_HOST` instead of restating it by hand, so the two
# cannot drift if the suffix changes.
replacements:
  - source:
      kind: Service
      name: vectis-db
      fieldPath: metadata.name
    targets:
      - select:
          kind: ConfigMap
          name: vectis-db
        fieldPaths:
          - data.VECTIS_DB_HOST

commonAnnotations:
  vectis.dev/environment: staging

# The tag here is the deployment source of truth. Argo CD Image Updater rewrites
# `newTag` in place (write-back-method: git) each time a new main-<sha> image is
# published, and Argo CD then syncs it — the automated path to staging.
images:
  - name: ghcr.io/meta-agentic/meta-tracker
    newTag: staging

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: vectis
