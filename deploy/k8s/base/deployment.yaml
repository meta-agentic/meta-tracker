apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectis
  labels:
    app.kubernetes.io/name: vectis
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vectis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vectis
        app.kubernetes.io/component: server
    spec:
      # Pod-level hardening; the native runner already runs as uid 1001 (see
      # Dockerfile), this makes the guarantee explicit and enforced by the API.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Overwritten per-environment by the kustomize `images` transformer and
          # kept current by Argo CD Image Updater; never edited by hand.
          image: ghcr.io/meta-agentic/meta-tracker:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # PostgreSQL connection, per the `VECTIS_DB_*` contract. Host, port,
          # database and user come from the generated `vectis-db` ConfigMap.
          # The password has no default anywhere, in the manifests or in the
          # application, and is read only from the `vectis-db` Secret. That
          # Secret is created out of band and never committed, for example:
          #   kubectl -n <namespace> create secret generic vectis-db \
          #     --from-literal=password="$(openssl rand -base64 32)"
          # Until it exists the pod stays in CreateContainerConfigError, and a
          # rolling update stalls with the previous pods still serving.
          envFrom:
            - configMapRef:
                name: vectis-db
          env:
            # Optional, documented in vectis-server's application.properties: VECTIS_DB_SSL_MODE
            # (disable | require | verify-full), VECTIS_DB_SSL_ROOT_CERT (a PEM bundle; the image's
            # operating-system CAs by default) and VECTIS_DB_MIGRATOR_USER / _PASSWORD (a login for
            # Flyway that owns the tables, so this one needs no DDL right). The in-cluster PostgreSQL
            # of components/postgres needs none of them.
            - name: VECTIS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectis-db
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Quarkus SmallRye Health endpoints. startupProbe covers native cold
          # start; readiness gates traffic/rollout; liveness restarts a wedged pod.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem is on, so give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
