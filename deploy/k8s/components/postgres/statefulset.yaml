apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vectis-db
  labels:
    app.kubernetes.io/name: vectis-db
    app.kubernetes.io/component: database
spec:
  serviceName: vectis-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vectis-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vectis-db
        app.kubernetes.io/component: database
    spec:
      # Same hardening as the server. The alpine image's `postgres` user is uid
      # 70, and fsGroup makes the volume writable for it without a root init step.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Same major and variant as the CI service containers in jvm-test.yml
          # and native-deploy.yml, so the database the tests ran against is the
          # one that gets deployed.
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: vectis-db
                  key: VECTIS_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: vectis-db
                  key: VECTIS_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectis-db
                  key: password
            # A subdirectory, because the volume root may hold `lost+found` and
            # initdb refuses a non-empty data directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # With a read-only root filesystem, the socket directory and /tmp
            # have to be writable volumes.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
