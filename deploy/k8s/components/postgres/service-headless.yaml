apiVersion: v1
kind: Service
metadata:
  # Governing Service for the StatefulSet (its `serviceName`), giving the pod a
  # stable DNS identity. It is headless from the start because `spec.clusterIP`
  # cannot be changed on an existing Service. Clients use `vectis-db`, not this.
  name: vectis-db-headless
  labels:
    app.kubernetes.io/name: vectis-db
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vectis-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
