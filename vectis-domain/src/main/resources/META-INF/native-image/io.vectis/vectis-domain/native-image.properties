# TimeOrderedId keeps a SecureRandom in a static field. If the class is initialized while the
# image is built, that generator and its seed end up in the image heap, which native-image refuses
# (VEC-54: the import's upsert is the first path to reach it). Initialized at run time, the
# generator is created when the executable starts.
Args = --initialize-at-run-time=io.vectis.domain.TimeOrderedId
