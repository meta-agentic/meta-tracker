# TimeOrderedId keeps a SecureRandom in a static field. Initialized while the image is built,
# that generator and its seed end up in the image heap, which native-image refuses. It is
# initialized at build time because the Flyway migration V4_1 (BuiltInTemplates.seed, which
# calls TimeOrderedId.next() at BuiltInTemplates.java:133) is executed during image generation,
# so a lazily created generator does not help: the first identifier is minted at build time.
# Initialized at run time, the class and its generator are created when the executable starts.
# The native build failed on this in VEC-54 (UnsupportedFeatureException: Detected an instance of
# Random/SplittableRandom class in the image heap), and a lazy holder in TimeOrderedId was tried
# and did not fix it.
Args = --initialize-at-run-time=io.vectis.domain.TimeOrderedId
