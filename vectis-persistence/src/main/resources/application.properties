# Persistence defaults. The datasource is configured twice on purpose:
#
#   * `reactive.url` is the runtime query path — non-blocking, Mutiny end to end.
#   * `jdbc.url` exists solely so Flyway (which is JDBC-only) can migrate at startup.
#
# Keeping both on the one datasource means a deployment configures a single database,
# and the JDBC pool stays small because nothing but migration ever borrows from it.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=2

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
