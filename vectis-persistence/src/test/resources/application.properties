# Tests run against a real PostgreSQL, not an in-memory substitute: the things this
# module has to get right — jsonb round-tripping, uuid byte ordering, GIN containment,
# batch inserts in one transaction — are precisely the behaviours a fake would fake.
#
# Dev Services is disabled so the target is explicit and the suite does not silently
# depend on a container runtime being present.

quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${VECTIS_DB_USER:vectis}
quarkus.datasource.password=${VECTIS_DB_PASSWORD:vectis}
quarkus.datasource.jdbc.url=jdbc:postgresql://${VECTIS_DB_HOST:127.0.0.1}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}
quarkus.datasource.reactive.url=postgresql://${VECTIS_DB_HOST:127.0.0.1}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}

# Each run starts from an empty database, so a passing suite proves the migrations
# build the schema from nothing rather than relying on leftovers from a previous run.
quarkus.flyway.clean-at-start=true
quarkus.flyway.clean-disabled=false
