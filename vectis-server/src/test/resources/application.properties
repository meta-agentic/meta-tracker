# Most server tests need no database, so the datasource is off for them and the suite
# stays as fast as before VEC-101 (an inactive datasource opens no pool, runs no
# Flyway and drops out of the readiness check). A test that needs the database
# switches it on with DatabaseResource.
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false

# The production-only password mapping (DatabaseConfig) still has to load.
vectis.db.password=not-used

# The /api/v1 resources use the persistence repositories, which keep the reactive pool bean
# and so need a database at boot. The other tests run without one, so the resources are left
# out of their application; ApiTestProfile puts them back for the tests that have a database.
quarkus.arc.exclude-types=io.vectis.server.api.*
