# Vectis server (spike). Commercial audit is opt-in and OFF by default, so a
# stock OSS deployment boots on the community floor. A licensed deployment that
# also has the enterprise plugin JAR present sets this to true.
vectis.enterprise.audit.enabled=false

quarkus.http.port=8080
quarkus.banner.enabled=false

# One origin (VEC-78): the built web client ships in META-INF/resources, so the
# SPA at / and the API at /api/v1 share an origin. The history fallback is
# SpaHistoryFallback; the headers are here and SpaOneOriginTest pins them.
#
# Scripts and styles come from 'self' only: no 'unsafe-inline', which is why the
# theme bootstrap is a file (web/public/theme-boot.js) and not an inline script.
# VEC-35 adds the OIDC issuer to connect-src and may widen form-action (ADR-VEC-02 D1).
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

# Hashed /assets are immutable for a year, but only when found: that policy
# depends on the status, so it is AssetCachePolicy, not a header filter here.
# The shell names the current hashes, so it must never be served from a cache.
# A deep link reaches it through a reroute to /index.html, which this matches.
quarkus.http.filter.shell.matches=/(index\\.html)?
quarkus.http.filter.shell.header."Cache-Control"=no-store
# Unhashed top-level files (favicon.svg, theme-boot.js) keep their URL when they
# change, so they revalidate. Without this the static handler marks them
# immutable for a day.
quarkus.http.filter.unhashed.matches=/(?!index\\.html$)[^/]+\\.[^/]+
quarkus.http.filter.unhashed.header."Cache-Control"=no-cache

# The database (VEC-101). db-kind, the pool sizes and Flyway come from vectis-persistence;
# a deployment only says where the database is, through the VECTIS_DB_* contract
# (deploy/k8s/base: host, port, name and user from the vectis-db ConfigMap, the password
# from the vectis-db Secret and nowhere else). One database, two clients: the reactive
# pool serves requests, the JDBC datasource exists for Flyway alone.
#
# Production profile only, so tests and `quarkus:dev` get their own settings. Host, port,
# name and user default to the local-database values the persistence tests use, which keeps
# a jar built without the variables from silently having no database (Quarkus decides
# whether a datasource exists when it builds, from whether its URL resolves); a deployment
# that forgets them then fails the boot with a refused connection, not a green pod. The
# default host only helps local runs: in a pod 127.0.0.1 is never the database, so the
# boot fails there.
#
# The password has no default and may not be empty. Quarkus alone would connect without one
# (and boot passwordless against a trust-auth database), so it goes through DatabaseConfig,
# a mapping whose required value is checked when the configuration loads, before any
# connection: an unset or empty VECTIS_DB_PASSWORD fails the boot naming vectis.db.password.
#
# An unreachable database fails the boot, on purpose: Flyway migrates at start
# (quarkus.flyway.migrate-at-start in vectis-persistence), the pod must not serve on an
# unmigrated schema, and the startup probe then keeps it out of rotation. Once up, losing
# the database shows as /q/health/ready 503 (the reactive pool check) and never as a
# failed liveness probe, which would restart a healthy process for an outage it cannot fix.
%prod.quarkus.datasource.username=${VECTIS_DB_USER:vectis}
%prod.vectis.db.password=${VECTIS_DB_PASSWORD}
%prod.quarkus.datasource.password=${vectis.db.password}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${VECTIS_DB_HOST:127.0.0.1}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}
%prod.quarkus.datasource.reactive.url=postgresql://${VECTIS_DB_HOST:127.0.0.1}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}

# Outside production nothing reads the password through the mapping: tests and dev get their
# database from Dev Services or from their own test resource.
%dev.vectis.db.password=not-used
