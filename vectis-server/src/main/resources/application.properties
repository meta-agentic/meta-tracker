# Vectis server (spike). Commercial audit is opt-in and OFF by default, so a
# stock OSS deployment boots on the community floor. A licensed deployment that
# also has the enterprise plugin JAR present sets this to true.
vectis.enterprise.audit.enabled=false

quarkus.http.port=8080
quarkus.banner.enabled=false

# The product API reads and writes PostgreSQL through vectis-persistence. The
# database is named by the same VECTIS_DB_* contract CI uses; there is no default
# password, so a deployment that forgets to supply one fails at startup.
quarkus.datasource.username=${VECTIS_DB_USER:vectis}
quarkus.datasource.password=${VECTIS_DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${VECTIS_DB_HOST:localhost}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}
quarkus.datasource.reactive.url=postgresql://${VECTIS_DB_HOST:localhost}:${VECTIS_DB_PORT:5432}/${VECTIS_DB_NAME:vectis}
