# Vectis server (spike). Commercial audit is opt-in and OFF by default, so a
# stock OSS deployment boots on the community floor. A licensed deployment that
# also has the enterprise plugin JAR present sets this to true.
vectis.enterprise.audit.enabled=false

quarkus.http.port=8080
quarkus.banner.enabled=false

# One origin (VEC-78): the built web client ships in META-INF/resources, so the
# SPA at / and the API at /api/v1 share an origin. The history fallback is
# SpaHistoryFallback; the headers are here and SpaOneOriginTest pins them.
#
# Scripts and styles come from 'self' only: no 'unsafe-inline', which is why the
# theme bootstrap is a file (web/public/theme-boot.js) and not an inline script.
# VEC-35 adds the OIDC issuer to connect-src and may widen form-action (ADR-VEC-02 D1).
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

# Hashed /assets are immutable for a year, but only when found: that policy
# depends on the status, so it is AssetCachePolicy, not a header filter here.
# The shell names the current hashes, so it must never be served from a cache.
# A deep link reaches it through a reroute to /index.html, which this matches.
quarkus.http.filter.shell.matches=/(index\\.html)?
quarkus.http.filter.shell.header."Cache-Control"=no-store
# Unhashed top-level files (favicon.svg, theme-boot.js) keep their URL when they
# change, so they revalidate. Without this the static handler marks them
# immutable for a day.
quarkus.http.filter.unhashed.matches=/(?!index\\.html$)[^/]+\\.[^/]+
quarkus.http.filter.unhashed.header."Cache-Control"=no-cache
