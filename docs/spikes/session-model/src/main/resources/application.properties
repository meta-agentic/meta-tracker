# Session-model spike: Vectis as a backend-for-frontend (BFF) in front of an external OIDC
# provider. Two OIDC tenants, chosen per request by BearerOrSession:
#   default — application-type=web-app: the browser. Code flow + PKCE as a CONFIDENTIAL
#             client; tokens live only in the encrypted HttpOnly q_session cookie.
#   bearer  — application-type=service: agents and tools sending Authorization: Bearer.
# One `hybrid` tenant cannot do this cleanly: the ID token (web-app) must carry aud=client_id
# while the provider's access tokens carry aud=issuer, and one tenant has one audience rule.

vectis.issuer=${VECTIS_ISSUER:https://iam.vectis.localhost:9443}

quarkus.http.port=8080
quarkus.http.ssl-port=${VECTIS_SSL_PORT:8443}
quarkus.http.ssl.certificate.files=${VECTIS_TLS_CERT}
quarkus.http.ssl.certificate.key-files=${VECTIS_TLS_KEY}
quarkus.http.insecure-requests=disabled

# --- shared trust: the provider's certificate is issued by the spike's local CA -------------
quarkus.tls.oidc.trust-store.p12.path=${VECTIS_TRUSTSTORE}
quarkus.tls.oidc.trust-store.p12.password=changeit

# --- default tenant: the browser session (web-app) ----------------------------------------
quarkus.oidc.auth-server-url=${vectis.issuer}
quarkus.oidc.tls.tls-configuration-name=oidc
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=vectis-bff
quarkus.oidc.credentials.client-secret.value=${VECTIS_CLIENT_SECRET}
quarkus.oidc.credentials.client-secret.method=basic
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# XHR/fetch carrying `X-Requested-With: JavaScript` is never redirected to the provider.
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.cookie-same-site=lax
# Refresh the session server-side with the refresh token instead of a new browser round trip.
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=${VECTIS_SESSION_EXTENSION:PT30M}
# Token state: all tokens, encrypted with a key every replica shares (D9).
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
quarkus.oidc.token-state-manager.encryption-required=true
quarkus.oidc.token-state-manager.encryption-secret=${VECTIS_SESSION_KEY}
quarkus.oidc.token-state-manager.split-tokens=true

# --- bearer tenant: resource server for agents ---------------------------------------------
quarkus.oidc.bearer.auth-server-url=${vectis.issuer}
quarkus.oidc.bearer.tls.tls-configuration-name=oidc
quarkus.oidc.bearer.application-type=service
quarkus.oidc.bearer.client-id=vectis-api
# The provider stamps aud = its own issuer on every access token (finding F3). Accepting that
# alone would accept a token minted for ANY client of the provider, so the token's client_id
# must also be on an allow-list.
quarkus.oidc.bearer.token.audience=${VECTIS_BEARER_AUDIENCE:${vectis.issuer}}
vectis.bearer.allowed-clients=${VECTIS_BEARER_CLIENTS:vectis-bff}

# --- routes ---------------------------------------------------------------------------------
quarkus.http.auth.permission.public.paths=/signin.html,/signin.js,/app.css,/auth/signin-config,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.private.paths=/*
quarkus.http.auth.permission.private.policy=authenticated

quarkus.log.category."io.quarkus.oidc".level=${VECTIS_OIDC_LOG:INFO}

# --- response headers (D3: the sign-in page runs under a strict CSP) ------------------------
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ${vectis.issuer}; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
