# Spike defaults. Every value is overridden per instance on the command line (see demo.sh).
quarkus.banner.enabled=false
quarkus.http.port=5741

quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5740/vec46
quarkus.datasource.username=vec46
# Throwaway container credential for a local spike database; never a deployed secret.
quarkus.datasource.password=vec46
quarkus.datasource.reactive.max-size=16

# Instance label, echoed by /spike/whoami and in the logs.
spike.instance=A
# none         : naive in-JVM broadcast after commit (reaches only this instance's clients)
# pg           : the recommended carrier: NOTIFY inside the write transaction as a doorbell,
#                each instance reads the event rows from the workspace_event log
# pg-postcommit: the full event published AFTER commit (a broker-shaped dual write), used
#                only to demonstrate the ordering hazard
spike.carrier=pg
# pg-postcommit only: stall the publish this long after commit, to simulate a slow publisher.
spike.publish-delay-ms=0
# pg only: stall this instance's feed before it delivers, standing in for a GC pause or a slow read.
spike.feed-delay-ms=0
