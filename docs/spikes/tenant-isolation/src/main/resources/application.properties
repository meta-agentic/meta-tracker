# Spike defaults; run.sh overrides host, port and database. Credentials are throwaway roles
# the harness creates in a local spike database, never deployed secrets.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.vectis.spike".level=INFO

# The pool under test: the application role, which owns nothing and cannot bypass RLS.
# max-size is the product's default (quarkus.datasource.reactive.max-size is unset there).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://127.0.0.1:5432/tenancy_spike
quarkus.datasource.username=spike_app
quarkus.datasource.password=spike_app

# The schema owner: creates the tables and policies and seeds the data, and is never used to
# read. It is a separate role because a table's owner is exempt from its RLS policies unless
# FORCE ROW LEVEL SECURITY is set, and a superuser is exempt always.
quarkus.datasource.owner.db-kind=postgresql
quarkus.datasource.owner.reactive.url=postgresql://127.0.0.1:5432/tenancy_spike
quarkus.datasource.owner.username=spike_owner
quarkus.datasource.owner.password=spike_owner

# Server notices (DROP ... IF EXISTS on a fresh database) are not results.
quarkus.log.category."io.vertx.sqlclient.impl.SocketConnectionBase".level=ERROR
